[workspace]
members = ["ui"]

[package]
name = "kpdrive"
version = "0.6.0"
edition = "2024"
description = "Proton Drive sync client for KDE Plasma"
license = "GPL-3.0-or-later"

[dependencies]
gettext = "0.4"
aes-gcm = "0.11"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4"
hmac = "0.12"
ignore = "0.4"
ksni = "0.3"
notify = "8"
oo7 = "0.6.0"
# Proton's own crypto: SRP login, user/address keys. Pinned commit, pure-Rust backend.
proton-crypto = { git = "https://github.com/ProtonMail/proton-crypto-rs", rev = "7797aacf5ae39b0982e594eb12b26489c2e77b48", default-features = false, features = ["rustpgp"] }
proton-crypto-account = { git = "https://github.com/ProtonMail/proton-crypto-rs", rev = "7797aacf5ae39b0982e594eb12b26489c2e77b48", default-features = false, features = ["rustpgp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "net", "sync", "time", "io-util"] }
zeroize = "1.9.0"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
