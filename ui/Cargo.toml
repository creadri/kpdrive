[package]
name = "kpdrive-ui"
version = "0.1.0"
edition = "2021"
description = "Account and log window for kpdrive"
license = "GPL-3.0-or-later"

[dependencies]
kpdrive = { path = ".." }
anyhow = "1"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
cxx-qt-build = "0.10"
